name: Publish scheduled Insights

on:
  schedule:
    # Primary: 01:00 UTC (nominal 10:00 JST). GHA often runs ~3h late → ~13:00 JST in practice.
    - cron: '0 1 * * 1-5'
    # Fallback: idempotent re-run if primary skipped or still delayed (weekdays).
    - cron: '0 4 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      force_slug:
        description: 'Optional: force-publish one slug (ignore publishAt)'
        required: false
        default: ''
      now:
        description: 'Optional: simulate now (full ISO8601, e.g. 2026-08-05T10:00:00+09:00 — date-only不可)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-scheduled-insights
  cancel-in-progress: false

jobs:
  publish-and-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare scheduled HTML (quality gate)
        run: node scripts/prepare-scheduled-article.mjs --scheduled

      - name: Publish due articles
        id: publish
        env:
          FORCE_SLUG: ${{ github.event.inputs.force_slug }}
          NOW: ${{ github.event.inputs.now }}
        run: |
          set -euo pipefail
          if [ -n "${NOW:-}" ] && [[ ! "${NOW}" =~ T ]]; then
            echo "NOW must be full ISO8601 (e.g. 2026-08-05T10:00:00+09:00). Date-only values are rejected."
            exit 1
          fi
          CMD=(node scripts/publish-scheduled-insights.mjs)
          if [ -n "${FORCE_SLUG:-}" ]; then CMD+=(--force-slug "$FORCE_SLUG"); fi
          if [ -n "${NOW:-}" ]; then CMD+=(--now "$NOW"); fi
          "${CMD[@]}" | tee /tmp/publish.log
          if grep -q 'UPDATED=1' /tmp/publish.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            SLUG=$(grep '^Published:' /tmp/publish.log | sed 's/Published: //' | awk -F, '{print $1}' | xargs)
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

      - name: Queue Buffer posts (after Web deploy)
        id: buffer
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.slug != ''
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_ID_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_ID_LINKEDIN }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_TWITTER: ${{ secrets.BUFFER_CHANNEL_ID_TWITTER }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          node scripts/queue-daily-buffer-posts.mjs \
            --force-slug "${{ steps.publish.outputs.slug }}" \
            --wait-deploy \
            --channels linkedin,facebook,x \
            | tee /tmp/queue-buffer.log
          if grep -q 'UPDATED=1' /tmp/queue-buffer.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push (single atomic commit)
        if: steps.publish.outputs.changed == 'true' || steps.buffer.outputs.changed == 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/lib/gha-git-push.sh
          scripts/lib/gha-git-push.sh \
            "$(cat <<'EOF'
          Publish scheduled Insights (+ Buffer queue)

          Single commit: Web publish, index/sitemap/llms, buffer + linkedin queue state.
          EOF
          )" \
            insights/ sitemap.xml llms.txt

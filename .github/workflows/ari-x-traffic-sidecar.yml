name: ARI X Traffic Sidecar (dry-run)

on:
  schedule:
    # 05:00 JST (20:00 UTC previous day): prepare before the 06:00 JST slot.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional JST date YYYY-MM-DD'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ari-x-traffic-sidecar
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Sidecar plan and read-only capacity report
        env:
          ARI_X_TRAFFIC_ENABLED: 'false'
          ARI_X_TRAFFIC_DRY_RUN: 'true'
          ARI_X_TRAFFIC_COOLDOWN_DAYS: '14'
          ARI_X_TRAFFIC_MAX_UTF16: '280'
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID_TWITTER: ${{ secrets.BUFFER_CHANNEL_ID_TWITTER }}
          SIDEcar_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${SIDEcar_DATE:-}" ]; then
            node scripts/x-traffic-sidecar/run.mjs --dry-run --date="${SIDEcar_DATE}"
          else
            node scripts/x-traffic-sidecar/run.mjs --dry-run
          fi

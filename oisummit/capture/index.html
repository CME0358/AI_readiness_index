<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OISUMMIT Capture</title>
<style>
:root{color-scheme:dark;--bg:#07121c;--panel:#102331;--panel2:#162d3e;--line:#29495b;--text:#f5f8fa;--muted:#a8bbc5;--accent:#60d6d0;--hot:#ff6b5e;--warm:#ffc857;--ok:#8ff0a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{width:min(100%,720px);margin:auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h1{font-size:20px;margin:0}h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.status{min-height:22px;color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.target-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.target{position:relative;text-align:left;min-height:54px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font:inherit;cursor:pointer}.target small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.target.must{border-color:#8e504c}.target.selected{outline:3px solid var(--accent);outline-offset:1px}.pill{display:inline-block;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.04em}.pill.must{background:#5b2826;color:#ffb6ae}.pill.core{background:#25465a;color:#b7e8ff}.pill.backup{background:#3d3d2c;color:#ffe79b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#091923;color:var(--text);font:inherit;margin-bottom:9px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#091923;color:var(--text);font:inherit;font-size:16px}textarea{min-height:76px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus{outline:3px solid var(--accent);outline-offset:2px}.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}.choice[aria-pressed=true]{border-color:var(--accent);background:#164b52;color:#fff}.choice.hot[aria-pressed=true]{background:#74322e;border-color:var(--hot)}.choice.warm[aria-pressed=true]{background:#665024;border-color:var(--warm)}.choice.miss[aria-pressed=true]{background:#343d45}.hot-next{border-left:4px solid var(--hot);padding-left:10px}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.summary div{background:var(--panel2);border-radius:8px;padding:7px 3px;text-align:center;font-size:11px;color:var(--muted)}.summary b{display:block;font-size:18px;color:var(--text)}.hidden{display:none!important}.error{color:#ffaaa3;margin:8px 0}.success{background:#16452d;border:1px solid #4caf72;color:#d7ffe0;border-radius:14px;padding:18px;text-align:center;font-size:22px;font-weight:800}.savebar{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(7,18,28,.94);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.savebar button{display:block;width:min(100%,692px);margin:auto;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:#06202a;font:inherit;font-weight:800;font-size:18px;cursor:pointer}.savebar button:disabled{opacity:.55;cursor:wait}.secondary{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}.auth{max-width:430px;margin:15vh auto}.auth h1{margin-bottom:8px}.target-status{position:absolute;right:7px;top:7px;font-size:10px;color:var(--ok)}@media(min-width:560px){.target-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const targets=[
["sagamihara","相模原市","government","MUST","MAR","PUBLIC","DX推進課とのMAR Pilot Meeting"],
["biprogy","BIPROGY","company","MUST","AGENT_EXECUTION","TECH","AI/DX/R&Dとの30分Technical Meeting"],
["pacific_consultants","Pacific Consultants","partner","MUST","PARTNERSHIP","PUBLIC","自治体共同Pilot/横展開Discussion"],
["yokohama","横浜市","government","MUST","MAR","PUBLIC","External AI Readiness Benchmark"],
["goodpatch","Goodpatch","company","MUST","AGENT_READINESS","TECH","Agent-mediated UX Discussion"],
["hyogo","兵庫県","government","MUST","MAR","PUBLIC","ひょうごTECH接続30分相談"],
["shizuoka_city","静岡市","government","CORE","MAR","PUBLIC","DX推進課MAR Pilot"],
["toyama","富山市","government","CORE","MAR","PUBLIC","データ連携Pilot"],
["salesforce_japan","Salesforce Japan","company","CORE","AGENT_READINESS","ENTERPRISE","Agentforce技術Discussion"],
["nssol","NSSOL","company","CORE","AGENT_EXECUTION","TECH","AI/金融/R&D Technical Discussion"],
["kanagawa","神奈川県","government","CORE","MAR","PUBLIC","県民Journey MAR Pilot"],
["eiicon","eiicon","partner","CORE","PARTNERSHIP","GENERAL","紹介先1件"],
["shizuoka","静岡県","government","CORE","MAR","PUBLIC","県AI/DX担当30分"],
["gifu","岐阜県","government","CORE","MAR","PUBLIC","AIナビゲーター外部評価"],
["daido_life","大同生命","company","CORE","AGENT_EXECUTION","ENTERPRISE","DX戦略部/査定企画PoC"],
["nara","奈良県","government","BACKUP","MAR","PUBLIC","生成AI業務効率化＋外部評価"],
["yamanashi","山梨県","government","BACKUP","MAR","PUBLIC","生成AI人材→制度MAR"],
["mori_building","森ビル","company","BACKUP","PARTNERSHIP","PUBLIC","都市DX・横展開"],
["seino_holdings","セイノーホールディングス","company","BACKUP","AGENT_EXECUTION","ENTERPRISE","輸送要件/Business Outcome"],
["tokyo","東京都","government","BACKUP","MAR","PUBLIC","都市サービス評価"]
].map(([id,name,type,priority,route,demo,goal])=>({id,name,type,priority,route,demo,goal}));
const queueKey="oisummit_capture_queue_v1", captureKey="oisummit_capture_local_v1", tokenKey="oisummit_capture_token_v1";
const app=document.getElementById("app");
let state={target:null,adhoc:null,result:"",next:"NONE",due:"NONE",method:"NONE",saving:false,pending:null,auth:sessionStorage.getItem(tokenKey)||""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getLocal=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};
const setLocal=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function renderAuth(){app.innerHTML='<main class="auth"><div class="panel"><h1>OISUMMIT Capture</h1><p class="sub">Internal event operations. API write is protected.</p><label for="token">Access token</label><input id="token" type="password" autocomplete="off" placeholder="Internal access token"><button class="secondary" id="unlock" style="margin-top:12px;width:100%">UNLOCK</button><p id="authError" class="error"></p></div></main>';document.getElementById("unlock").onclick=()=>{const v=document.getElementById("token").value.trim();if(!v){document.getElementById("authError").textContent="Token required";return}sessionStorage.setItem(tokenKey,v);state.auth=v;render();};}
function render(){if(!state.auth){renderAuth();return}app.innerHTML='<main><header><div><h1>OISUMMIT Capture</h1><p class="sub">10–20 sec / internal only</p></div><button class="secondary" id="lock">LOCK</button></header><div id="status" class="status" role="status"></div><section class="panel"><div class="summary" id="summary"></div></section><section><h2>Target</h2><input class="search" id="search" placeholder="Search target"><div class="target-grid" id="targets"></div><button class="secondary" id="adhocButton" style="width:100%;margin-top:9px;min-height:48px">＋ その他の企業・団体を入力</button><div id="adhocPanel"></div></section><section id="formPanel" class="panel"><label>Result <span aria-hidden="true">*</span></label><div class="choice-grid" id="results"><button class="choice hot" data-result="HOT" aria-pressed="false">HOT</button><button class="choice warm" data-result="WARM" aria-pressed="false">WARM</button><button class="choice contact" data-result="CONTACT" aria-pressed="false">CONTACT</button><button class="choice miss" data-result="MISS" aria-pressed="false">MISS</button></div><div id="hotNext" class="hot-next hidden"><label for="next">NEXT ACTION <span aria-hidden="true">*</span></label><select id="next"><option value="MEETING">MEETING</option><option value="INTRO">INTRO</option><option value="MATERIAL">MATERIAL</option><option value="FOLLOW">FOLLOW</option><option value="NONE">NONE</option></select><p class="sub">HOT + NONE is allowed; warning only.</p></div><label for="person">Person</label><input id="person" autocomplete="name" placeholder="氏名"><label for="dept">Department / Title</label><input id="dept" autocomplete="organization-title" placeholder="部署 / 役職"><label for="memo">Memo</label><textarea id="memo" maxlength="300" placeholder="課題 / 反応 / 次アクションだけ"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label for="due">Due</label><select id="due"><option value="9/14">9/14</option><option value="9/15">9/15</option><option value="9/16">9/16</option><option value="CUSTOM">CUSTOM</option><option value="NONE">NONE</option></select></div><div><label for="method">Contact Method</label><select id="method"><option value="BUSINESS_CARD">BUSINESS_CARD</option><option value="EMAIL">EMAIL</option><option value="LINKEDIN">LINKEDIN</option><option value="QR">QR</option><option value="OTHER">OTHER</option><option value="NONE">NONE</option></select></div></div><p id="error" class="error" role="alert"></p></section><section class="panel"><h2 style="margin-top:0">Today Summary · local</h2><div id="summaryText" class="sub"></div></section></main><div class="savebar"><button id="save">SAVE</button></div>';
document.getElementById("lock").onclick=()=>{sessionStorage.removeItem(tokenKey);state.auth="";renderAuth()};document.getElementById("search").oninput=e=>renderTargets(e.target.value);document.getElementById("adhocButton").onclick=()=>enterAdhoc(document.getElementById("search").value.trim());renderTargets("");renderAdhocPanel();bindForm();updateSummary();flushQueue();}
function makeAdhocId(){return "ADHOC_"+Date.now()+"_"+Math.random().toString(36).slice(2,8).toUpperCase();}
function enterAdhoc(prefill=""){state.target=null;state.adhoc=state.adhoc||{id:makeAdhocId(),name:"",type:"",route:""};if(prefill&&!state.adhoc.name)state.adhoc.name=prefill;renderTargets(document.getElementById("search")?.value||"");renderAdhocPanel();}
function renderAdhocPanel(){const el=document.getElementById("adhocPanel");if(!el)return;if(!state.adhoc){el.innerHTML="";return}el.innerHTML='<div class="panel" style="border-color:var(--accent)"><h2 style="margin-top:0">Ad-hoc Target</h2><label for="adhocName">企業・団体名 <span aria-hidden="true">*</span></label><input id="adhocName" maxlength="160" value="'+esc(state.adhoc.name)+'" placeholder="企業・団体名"><label>種別 <span aria-hidden="true">*</span></label><div class="choice-grid" style="grid-template-columns:repeat(4,1fr)"><button class="choice" data-adhoc-type="company" aria-pressed="'+(state.adhoc.type==="company")+'">企業</button><button class="choice" data-adhoc-type="government" aria-pressed="'+(state.adhoc.type==="government")+'">自治体</button><button class="choice" data-adhoc-type="partner" aria-pressed="'+(state.adhoc.type==="partner")+'">パートナー</button><button class="choice" data-adhoc-type="other" aria-pressed="'+(state.adhoc.type==="other")+'">その他</button></div><label>話したテーマ <span aria-hidden="true">*</span></label><div class="choice-grid"><button class="choice" data-adhoc-route="AGENT_READINESS" aria-pressed="'+(state.adhoc.route==="AGENT_READINESS")+'">Agent Readiness</button><button class="choice" data-adhoc-route="MAR" aria-pressed="'+(state.adhoc.route==="MAR")+'">MAR</button><button class="choice" data-adhoc-route="AGENT_EXECUTION" aria-pressed="'+(state.adhoc.route==="AGENT_EXECUTION")+'">Agent Execution</button><button class="choice" data-adhoc-route="PARTNERSHIP" aria-pressed="'+(state.adhoc.route==="PARTNERSHIP")+'">Partnership</button></div></div>';document.getElementById("adhocName").oninput=e=>state.adhoc.name=e.target.value;el.querySelectorAll("[data-adhoc-type]").forEach(b=>b.onclick=()=>{state.adhoc.type=b.dataset.adhocType;renderAdhocPanel()});el.querySelectorAll("[data-adhoc-route]").forEach(b=>b.onclick=()=>{state.adhoc.route=b.dataset.adhocRoute;renderAdhocPanel()});}
function renderTargets(query){const q=query.toLowerCase();const el=document.getElementById("targets");const matches=targets.filter(t=>t.name.toLowerCase().includes(q));el.innerHTML=matches.map(t=>{const status=getLocal(captureKey).filter(x=>x.target_id===t.id).at(-1)?.result||"";return '<button class="target '+(t.priority==="MUST"?"must":"")+(state.target?.id===t.id?" selected":"")+'" data-target="'+t.id+'"><span class="pill '+t.priority.toLowerCase()+'">'+t.priority+"</span> "+esc(t.name)+(status?'<span class="target-status">'+status+"</span>":"")+'<small>'+t.route+" · "+t.demo+"</small></button>"}).join("");if(!matches.length&&q)el.innerHTML='<p class="sub">該当する事前登録ターゲットがありません</p><button class="secondary" id="searchAdhoc" style="width:100%;min-height:48px">“'+esc(query)+'” を新規ターゲットとして登録</button>';if(!matches.length&&!q)el.innerHTML='<p class="sub">No target</p>';el.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{state.target=targets.find(t=>t.id===b.dataset.target);state.adhoc=null;renderTargets(document.getElementById("search").value);renderAdhocPanel();});document.getElementById("searchAdhoc")?.addEventListener("click",()=>enterAdhoc(query));}
function bindForm(){document.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>{state.result=b.dataset.result;document.querySelectorAll("[data-result]").forEach(x=>x.setAttribute("aria-pressed",x===b));const hot=state.result==="HOT";document.getElementById("hotNext").classList.toggle("hidden",!hot);if(state.result==="MISS"){document.getElementById("next").value="FOLLOW";state.next="FOLLOW";}updateSummary();});document.getElementById("next").onchange=e=>state.next=e.target.value;document.getElementById("due").onchange=e=>state.due=e.target.value;document.getElementById("method").onchange=e=>state.method=e.target.value;document.getElementById("save").onclick=save;}
function selectedTarget(){if(state.target)return state.target;if(!state.adhoc)return null;return{id:state.adhoc.id,name:state.adhoc.name.trim(),type:state.adhoc.type,priority:"BACKUP",route:state.adhoc.route};}
function collect(){const target=selectedTarget();return{capture_id:crypto.randomUUID(),event:"OISUMMIT_2026",captured_at:new Date().toISOString(),target_id:target.id,target_name:target.name,target_type:target.type,priority:target.priority,route:target.route,person:document.getElementById("person").value.trim(),department_title:document.getElementById("dept").value.trim(),result:state.result,memo:document.getElementById("memo").value.trim(),next_action:state.next,due:state.due,contact_method:state.method,source:"oisummit_capture"};}
async function send(payload){const res=await fetch("/api/oisummit-capture",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+state.auth},body:JSON.stringify(payload)});let body={};try{body=await res.json()}catch{}if(!res.ok)throw new Error(body.error||"save_failed");return body;}
async function flushQueue(){const queued=getLocal(queueKey);if(!queued.length)return;const remaining=[];for(const payload of queued){try{await send(payload);setLocal(captureKey,[...getLocal(captureKey),payload]);}catch{remaining.push(payload);}}setLocal(queueKey,remaining);if(remaining.length)setStatus("QUEUED LOCALLY — RETRY");else setStatus("QUEUED CAPTURES SENT");updateSummary();}
async function save(){const err=document.getElementById("error");err.textContent="";const target=selectedTarget();if(!target){err.textContent="Target required";return}if(!target.name){err.textContent="企業・団体名 required";return}if(state.adhoc&&(!state.adhoc.type||!state.adhoc.route)){err.textContent="種別と話したテーマ required";return}if(!state.result){err.textContent="Result required";return}if(state.saving)return;state.saving=true;const button=document.getElementById("save");button.disabled=true;button.textContent="SAVING…";const payload=state.pending||collect();try{await send(payload);setLocal(captureKey,[...getLocal(captureKey),payload]);state.pending=null;showSaved();}catch(e){state.pending=payload;if(!navigator.onLine||e.message==="Failed to fetch"){const queued=getLocal(queueKey);if(!queued.some(x=>x.capture_id===payload.capture_id))setLocal(queueKey,[...queued,payload]);setStatus("QUEUED LOCALLY — RETRY");}else{setStatus("SAVE FAILED — RETRY");}err.textContent=e.message==="CONFIG_REQUIRED"?"CONFIG_REQUIRED — write disabled":e.message;button.disabled=false;button.textContent="RETRY";state.saving=false;}}
function showSaved(){document.querySelector("main").innerHTML='<div class="success">SAVED ✓<p class="sub">Capture stored</p><button class="secondary" id="nextCapture">CAPTURE NEXT</button></div>';document.getElementById("nextCapture").onclick=()=>{state={target:null,adhoc:null,result:"",next:"NONE",due:"NONE",method:"NONE",saving:false,pending:null,auth:state.auth};render();};}
function setStatus(s){const el=document.getElementById("status");if(el)el.textContent=s;}
function updateSummary(){const xs=getLocal(captureKey);const counts=["HOT","WARM","CONTACT","MISS"].map(x=>[x,xs.filter(y=>y.result===x).length]);const next=["MEETING","INTRO","FOLLOW"].map(x=>x+":"+xs.filter(y=>y.next_action===x).length).join(" · ");const sum=document.getElementById("summary");if(sum)sum.innerHTML=counts.map(([x,n])=>"<div><b>"+n+"</b>"+x+"</div>").join("")+'<div><b>'+xs.length+"</b>TOTAL</div>";const txt=document.getElementById("summaryText");if(txt)txt.textContent=next+" · Queue:"+getLocal(queueKey).length;};
render();
</script>
</body>
</html>
